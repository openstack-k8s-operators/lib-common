version: "2"

linters:
  # Enable specific linter
  # https://golangci-lint.run/usage/linters/#enabled-by-default
  enable:
    - errorlint
    - revive
    - ginkgolinter
    - govet
    - errname
    - err113
    - gosec

  settings:
    revive:
      rules:
      - name: unused-parameter
        severity: warning
        disabled: true

  exclusions:
    rules:
      - path: modules/common/secret/password_test.go
        linters:
          - gosec
        text: "G101"

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
