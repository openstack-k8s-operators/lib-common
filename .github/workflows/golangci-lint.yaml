name: Golang lint, vet and unit test pipeline

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: github (govet, golint, gotest and govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.26.x
          check-latest: true
      - name: Checkout project code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run govet.sh
        run: make govet
      - name: Run golint.sh
        run: make golint
      - name: Run gotest.sh
        run: make gotest
      - name: Check Go modules for vulnerabilities
        run: make govulncheck

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: 1.26.x
        check-latest: true
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
    - name: skip branch check
      run: echo "SKIP=no-commit-to-branch" >> "$GITHUB_ENV"
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
      with:
        extra_args: --all-files --show-diff-on-failure --verbose
